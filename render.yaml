# render.yaml — Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
#
# This reuses the existing multi-stage Dockerfile. Render builds the image
# on its own infrastructure; GitHub Actions gates the deploy (see
# .github/workflows/deploy.yml) by calling the Render API after CI passes.
#
# autoDeploy is OFF on purpose: deploys are triggered by the GitHub Action
# (JorgeLNJunior/render-deploy, using RENDER_SERVICE_ID + RENDER_API_KEY),
# so a broken build/type-check never reaches production.

services:
  - type: web
    name: fe-barber-handler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free            # change to "starter" to avoid free-tier spin-down
    region: frankfurt     # closest EU region
    branch: main
    autoDeploy: false     # GitHub Actions triggers deploys via the Deploy Hook
    healthCheckPath: /

    envVars:
      # --- Runtime config (safe to commit) ---
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"     # must match EXPOSE in the Dockerfile
      - key: HOST
        value: 0.0.0.0

      # --- Secrets / per-environment values: set in the Render dashboard ---
      # sync:false => Render keeps the value, it is NOT read from this file.
      - key: MONGODB_URI
        sync: false
      # Recommended for adapter-node behind a proxy. Set to your full app URL,
      # e.g. https://fe-barber-handler.onrender.com
      - key: ORIGIN
        sync: false

      # --- Demo credentials (read at runtime via $env/dynamic/public) ---
      - key: PUBLIC_DEMO_ADMIN_USERNAME
        sync: false
      - key: PUBLIC_DEMO_ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_DEMO_BARBER_USERNAME
        sync: false
      - key: PUBLIC_DEMO_BARBER_PASSWORD
        sync: false
      - key: PUBLIC_DEMO_CLIENT_USERNAME
        sync: false
      - key: PUBLIC_DEMO_CLIENT_PASSWORD
        sync: false
